services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      # Docker-outside-of-Docker: Portainer manages every stack on this host
      # (ai-stack, code-server, baumai, showlister, arm-docker) via this
      # socket, deploying/redeploying them from their GitHub repos (GitOps
      # stacks, see each repo's own docker-compose.yml). Intentionally the
      # one container on this box with broad docker.sock access.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
