services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      # Docker-outside-of-Docker: Portainer manages every stack on this host
      # (ai-stack, code-server, baumai, showlister, arm-docker) via this
      # socket, deploying/redeploying them from their GitHub repos (GitOps
      # stacks, see each repo's own docker-compose.yml). Intentionally the
      # one container on this box with broad docker.sock access.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      # ai-stack's obsidian-ai-backend/frontend build from this path (outside
      # any git repo, so it can't just live in the stack's own clone).
      # Portainer runs `docker compose build` from inside this container, and
      # build context is read client-side (unlike volumes:, which the host's
      # Docker daemon resolves directly) - so without this mount, that
      # absolute path doesn't exist from Portainer's point of view even
      # though it's real on the host. Same absolute path on both sides so
      # every reference to it elsewhere (ai-stack/docker-compose.yml) needs
      # no rewriting.
      - /home/bruiserbaum/baumhub/obsidian-ai:/home/bruiserbaum/baumhub/obsidian-ai:ro

volumes:
  portainer_data:
