# ── code-server — NPM Advanced Tab (Authentik Forward Auth) ───────────────────
#
# Paste this into Nginx Proxy Manager → code.baumwire.com → Advanced tab.
# Replace AUTHENTIK_HOST with your Authentik IP/hostname (e.g. 192.168.5.12).
#
# Prerequisites in Authentik UI (same steps as every other app — see
# ../README.md and docs/BaumAI README's "GitHub & Obsidian Vault Access"
# section for the pattern already used by baumagent/anythingllm/etc.):
#   1. Admin → Applications → Providers → Create → Proxy Provider
#      Mode: Forward auth (single application)
#      External host: https://code.baumwire.com
#   2. Admin → Applications → Create → link the provider above
#   3. Admin → Outposts → authentik Embedded Outpost → Edit → add the new app
#
# code-server also needs WebSocket support for its terminal/editor — the
# extra `proxy_http_version`/`Upgrade`/`Connection` headers below are not
# present in the plain npm-forward-auth.conf template because none of the
# other apps behind it need a persistent WebSocket connection to function.
# ──────────────────────────────────────────────────────────────────────────────

proxy_buffers 8 16k;
proxy_buffer_size 32k;
port_in_redirect off;

location / {
    proxy_pass          $forward_scheme://$server:$port;
    # Required — code-server validates Host/Origin on its WebSocket
    # reconnect endpoint (CSWSH protection) and 403s if this is missing,
    # since a custom location / here means NPM's own default Host-header
    # behavior no longer applies. Confirmed live 2026-10-23: omitting this
    # produced a 403 loop on /stable-<commit>?reconnectionToken=... while
    # every other request (static assets, login) worked fine.
    proxy_set_header     Host $host;

    # WebSocket upgrade — required for code-server's terminal and live editing
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 86400;

    ##############################
    # authentik-specific config
    ##############################
    auth_request     /outpost.goauthentik.io/auth/nginx;
    error_page       401 = @goauthentik_proxy_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header       Set-Cookie $auth_cookie;

    auth_request_set $authentik_username     $upstream_http_x_authentik_username;
    auth_request_set $authentik_groups       $upstream_http_x_authentik_groups;
    auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
    auth_request_set $authentik_email        $upstream_http_x_authentik_email;
    auth_request_set $authentik_name         $upstream_http_x_authentik_name;
    auth_request_set $authentik_uid          $upstream_http_x_authentik_uid;

    proxy_set_header X-authentik-username     $authentik_username;
    proxy_set_header X-authentik-groups       $authentik_groups;
    proxy_set_header X-authentik-entitlements $authentik_entitlements;
    proxy_set_header X-authentik-email        $authentik_email;
    proxy_set_header X-authentik-name         $authentik_name;
    proxy_set_header X-authentik-uid          $authentik_uid;
}

# Authentik outpost — must be accessible without authentication
location /outpost.goauthentik.io {
    proxy_pass              http://AUTHENTIK_HOST:9100/outpost.goauthentik.io;
    proxy_set_header        Host $host;
    proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
    add_header              Set-Cookie $auth_cookie;
    auth_request_set        $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
}

location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}
