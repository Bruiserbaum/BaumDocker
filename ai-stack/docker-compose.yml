services:

  # NOTE: the `ollama` service is intentionally omitted here — this deployment
  # uses a native Ollama instance already running on the Docker host
  # (systemd --user service, Vulkan GPU accel) instead of a containerized one.
  # OLLAMA_BASE_URL below points at the host's LAN IP for that reason.

  mongodb:
    image: mongo:7
    container_name: librechat-mongodb
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    networks:
      - ai_backend
    volumes:
      - mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: LibreChat

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    depends_on:
      - mongodb
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "3000:3080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      OLLAMA_BASE_URL: http://192.168.9.10:11434
      ALLOW_EMAIL_LOGIN: ${LIBRECHAT_ALLOW_EMAIL_LOGIN:-true}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-false}
      ALLOW_SOCIAL_LOGIN: ${LIBRECHAT_ALLOW_SOCIAL_LOGIN:-false}
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN_CLIENT}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN_SERVER}
      ALLOW_UNVERIFIED_EMAIL_LOGIN: true
      CONFIG_BYPASS_VALIDATION: false
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      SESSION_SECRET: ${LIBRECHAT_SESSION_SECRET}
      REFRESH_TOKEN_SECRET: ${LIBRECHAT_REFRESH_TOKEN_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Authentik SSO — set the four LIBRECHAT_OPENID_* vars in Portainer to enable
      OPENID_ISSUER: ${LIBRECHAT_OPENID_ISSUER}
      OPENID_CLIENT_ID: ${LIBRECHAT_OPENID_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${LIBRECHAT_OPENID_CLIENT_SECRET}
      OPENID_SESSION_SECRET: ${LIBRECHAT_OPENID_SESSION_SECRET}
      OPENID_SCOPE: openid profile email
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: Login with Authentik
      TRUST_PROXY: "1"
      OPENID_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons/png/authentik.png
      OPENID_GENERATE_NONCE: "false"
      OPENID_USE_END_SESSION_ENDPOINT: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat_uploads:/app/client/public/uploads
      - librechat_data:/app/data

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "3001:3001"
    environment:
      OLLAMA_BASE_URL: http://192.168.9.10:11434
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - anythingllm_storage:/app/server/storage
      - /home/bruiserbaum/Desktop/Bruiserbaum:/vault:ro

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    depends_on:
      - anythingllm
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      OLLAMA_BASE_URL: http://192.168.9.10:11434
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      GENERIC_TIMEZONE: ${TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n

  # ── obsidian-ai — visual agent/workflow orchestration platform ──
  # https://github.com/sup3rus3r/obsidian-ai
  # Frontend hardcodes API calls to http://localhost:8001, so it must share
  # the backend container's network namespace rather than talk over the
  # bridge network by service name.
  obsidian-ai-backend:
    build:
      context: /home/bruiserbaum/baumhub/obsidian-ai/backend
    pull_policy: build
    container_name: obsidian-ai-backend
    restart: unless-stopped
    env_file:
      - /home/bruiserbaum/baumhub/obsidian-ai/backend/.env
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "8101:8001"
      - "3100:3000"
    volumes:
      - obsidian_ai_data:/data
      - /home/bruiserbaum/Desktop/Bruiserbaum:/vault:ro

  obsidian-ai-frontend:
    build:
      context: /home/bruiserbaum/baumhub/obsidian-ai
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_ENCRYPTION_KEY: ${OBSIDIAN_AI_ENCRYPTION_KEY}
    pull_policy: build
    container_name: obsidian-ai-frontend
    restart: unless-stopped
    network_mode: "service:obsidian-ai-backend"
    env_file:
      - /home/bruiserbaum/baumhub/obsidian-ai/frontend/.env.local
    depends_on:
      - obsidian-ai-backend

networks:
  ai_frontend:
    driver: bridge
  ai_backend:
    driver: bridge

volumes:
  mongo:
  librechat_uploads:
  librechat_data:
  anythingllm_storage:
  n8n_data:
  obsidian_ai_data:
