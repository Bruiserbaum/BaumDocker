services:

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    networks:
      - ai_frontend
      - ai_backend
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # AMD ROCm device passthrough.
    # Set AMD_KFD_DEV=/dev/kfd and AMD_DRI_DEV=/dev/dri/renderD128 in .env to enable.
    # Default /dev/null mapping is a harmless no-op when AMD is disabled.
    # Find your render node with: ls /dev/dri/
    devices:
      - ${AMD_KFD_DEV:-/dev/null}:/dev/kfd
      - ${AMD_DRI_DEV:-/dev/null}:/dev/dri/renderD128
    group_add:
      - video
      - render
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 2
      # GPU toggles — see .env.example for full usage
      OLLAMA_IMAGE: ${OLLAMA_IMAGE:-ollama/ollama:latest}
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-none}
      # Models pulled on startup — set slot to empty string to skip
      OLLAMA_MODEL_1: ${OLLAMA_MODEL_1:-qwen2.5:7b-instruct}
      OLLAMA_MODEL_2: ${OLLAMA_MODEL_2:-qwen3-coder:30b-a3b-q4_K_M}
      OLLAMA_MODEL_3: ${OLLAMA_MODEL_3:-llama3.2:3b}
      OLLAMA_MODEL_4: ${OLLAMA_MODEL_4:-qwen2.5-coder:32b}
      OLLAMA_MODEL_5: ${OLLAMA_MODEL_5:-nomic-embed-text}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if echo "$OLLAMA_IMAGE" | grep -q "rocm"; then
          kfd_major=$(ls -l /dev/kfd 2>/dev/null | awk '{print $5}' | tr -d ',')
          if [ -z "$kfd_major" ] || [ "$kfd_major" = "1" ]; then
            echo "ERROR: OLLAMA_IMAGE=ollama/ollama:rocm but /dev/kfd is not available."
            echo "Install AMD ROCm driver on the host first: https://docs.ollama.com/gpu"
            exit 1
          fi
          echo "AMD ROCm: /dev/kfd verified (major=${kfd_major}), GPU acceleration active."
        fi
        ollama serve &
        sleep 5
        for model in "$OLLAMA_MODEL_1" "$OLLAMA_MODEL_2" "$OLLAMA_MODEL_3" "$OLLAMA_MODEL_4" "$OLLAMA_MODEL_5"; do
          [ -z "$model" ] && continue
          ollama list | grep -q "$model" || ollama pull "$model"
        done
        wait

  mongodb:
    image: mongo:7
    container_name: librechat-mongodb
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    networks:
      - ai_backend
    volumes:
      - mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: LibreChat

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    depends_on:
      - mongodb
      - ollama
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "3000:3080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      OLLAMA_BASE_URL: http://ollama:11434
      ALLOW_EMAIL_LOGIN: ${LIBRECHAT_ALLOW_EMAIL_LOGIN:-true}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-false}
      ALLOW_SOCIAL_LOGIN: ${LIBRECHAT_ALLOW_SOCIAL_LOGIN:-false}
      DOMAIN_CLIENT: ${LIBRECHAT_DOMAIN_CLIENT}
      DOMAIN_SERVER: ${LIBRECHAT_DOMAIN_SERVER}
      ALLOW_UNVERIFIED_EMAIL_LOGIN: true
      CONFIG_BYPASS_VALIDATION: false
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      SESSION_SECRET: ${LIBRECHAT_SESSION_SECRET}
      REFRESH_TOKEN_SECRET: ${LIBRECHAT_REFRESH_TOKEN_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Authentik SSO — set the four LIBRECHAT_OPENID_* vars in Portainer to enable
      OPENID_ISSUER: ${LIBRECHAT_OPENID_ISSUER}
      OPENID_CLIENT_ID: ${LIBRECHAT_OPENID_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${LIBRECHAT_OPENID_CLIENT_SECRET}
      OPENID_SESSION_SECRET: ${LIBRECHAT_OPENID_SESSION_SECRET}
      OPENID_SCOPE: openid profile email
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: Login with Authentik
      TRUST_PROXY: "1"
      OPENID_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons/png/authentik.png
      OPENID_GENERATE_NONCE: "false"
      OPENID_USE_END_SESSION_ENDPOINT: "true"
    volumes:
      - /opt/librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_uploads:/app/client/public/uploads
      - librechat_data:/app/data

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    depends_on:
      - ollama
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "3001:3001"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - anythingllm_storage:/app/server/storage

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${FAST_NODE:-TuringPiRK1}
    depends_on:
      - ollama
      - anythingllm
    networks:
      - ai_frontend
      - ai_backend
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      OLLAMA_BASE_URL: http://ollama:11434
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      GENERIC_TIMEZONE: ${TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n


networks:
  ai_frontend:
    driver: bridge
  ai_backend:
    driver: bridge

volumes:
  ollama:
  mongo:
  librechat_uploads:
  librechat_data:
  anythingllm_storage:
  n8n_data:
